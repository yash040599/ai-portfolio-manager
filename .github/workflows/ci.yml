# Lint + tests on every push. Deliberately does NOT touch the broker,
# place orders, or need any API key — everything here runs offline.
name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff==0.16.1

      # Bug-class rules only. Style rules (line length, quoting) are
      # deliberately excluded so CI never fails on cosmetics.
      - name: Lint
        run: ruff check . --select F,B,E711,E712,E713,E714,E722,PLE,PLW0602 --exclude .venv

      - name: Syntax check
        run: python -m compileall -q . -x "(__pycache__|\.venv)"

      - name: Tests
        run: python -m unittest discover -s tests -v
